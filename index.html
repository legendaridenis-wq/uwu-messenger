<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CrushX</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0e1621; color: #fff; height: 100vh; display: flex; overflow: hidden; }
    #auth-screen { position: fixed; inset: 0; background: #0e1621; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-box { background: #17212b; padding: 28px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; }
    .auth-box h1 { color: #5288c1; margin-bottom: 12px; }
    .auth-box input, .admin-group select, .admin-group input { width: 100%; padding: 11px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #2b3a4a; background: #242f3d; color: #fff; outline: none; }
    .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #5288c1; color: #fff; font-weight: 600; cursor: pointer; }
    .sidebar { width: 290px; background: #17212b; border-right: 1px solid #0e1621; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0e1621; }
    .admin-btn { background: #e5a93c; color: #000; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; display: none; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 12px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #131c26; }
    .chat-item:hover, .chat-item.active { background: #2b5278; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-title { font-weight: 600; font-size: 15px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-preview { font-size: 13px; color: #7f91a4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #5288c1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-panel { padding: 12px 15px; background: #131b24; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .main-chat { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 14px 20px; background: #17212b; display: flex; align-items: center; gap: 12px; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; min-width: 140px; background: #182533; padding: 10px 14px; border-radius: 14px; align-self: flex-start; }
    .msg.mine { background: #2b5278; align-self: flex-end; }
    .msg-sender { font-size: 13px; font-weight: 600; color: #64b5f6; margin-bottom: 5px; cursor: pointer; }
    .msg-body { font-size: 15px; line-height: 1.4; word-wrap: break-word; margin-bottom: 4px; }
    .msg-time { font-size: 11px; color: #8fa1b3; text-align: right; }
    .input-area { padding: 12px; background: #17212b; display: flex; gap: 10px; }
    .input-area input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #242f3d; color: #fff; outline: none; }
    .send-btn { background: #5288c1; color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-card { background: #17212b; padding: 22px; border-radius: 16px; width: 100%; max-width: 390px; position: relative; }
    .close-modal { position: absolute; top: 12px; right: 15px; background: none; border: none; color: #7f91a4; font-size: 20px; cursor: pointer; }
    .stats-row { display: flex; gap: 10px; margin: 15px 0; }
    .stat-box { flex: 1; background: #242f3d; padding: 10px; border-radius: 10px; text-align: center; }
    .gifts-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; background: #242f3d; padding: 10px; border-radius: 10px; min-height: 45px; }
    .gift-badge { background: #17212b; padding: 5px 9px; border-radius: 8px; border: 1px solid #354659; }
    .admin-group { margin-bottom: 10px; text-align: left; }
    .admin-group label { display: block; font-size: 12px; color: #7f91a4; margin-bottom: 4px; }
    .row-flex { display: flex; gap: 8px; }
    .row-flex input, .row-flex select { margin-bottom: 0; }
    .back-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; }
    @media (max-width: 700px) { .sidebar { width: 100%; position: absolute; inset: 0; z-index: 50; } .sidebar.hidden { display: none; } .back-btn { display: inline-block; } }
  </style>
</head>
<body>
<div id="auth-screen"><div class="auth-box"><h1>💠 CrushX</h1><input type="text" id="reg-name" placeholder="Ваше имя"/><input type="text" id="reg-user" placeholder="Юзернейм (на латинице)"/><input type="text" id="reg-avatar" placeholder="Ссылка на аватарку (необязательно)"/><input type="password" id="reg-secret" placeholder="Пароль владельца"/><button class="btn" onclick="login()">Войти</button></div></div>
<div class="sidebar" id="sidebar"><div class="sidebar-header"><b>💠 CrushX</b><button class="admin-btn" id="open-admin-btn" onclick="openAdmin()">👑 Админка</button></div><div class="chat-list" id="chat-list"></div><div class="user-panel" onclick="openMyProfile()"><div style="display:flex;align-items:center;gap:10px"><div class="avatar" id="my-avatar" style="width:36px;height:36px">👤</div><div><div id="my-name" style="font-weight:600;font-size:14px">Профиль</div><div id="my-stars" style="font-size:12px;color:#ffd54f">⭐ 0</div></div></div><span style="color:#7f91a4;font-size:12px">Профиль ❯</span></div></div>
<div class="main-chat"><div class="chat-header"><button class="back-btn" onclick="toggleSidebar()">☰</button><b id="current-chat-name">Общий чат CrushX</b></div><div class="messages" id="messages"></div><div class="input-area" id="input-area"><input type="text" id="msg-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMsg()"/><button class="send-btn" onclick="sendMsg()">➤</button></div></div>
<div class="modal" id="profile-modal"><div class="modal-card" style="text-align:center"><button class="close-modal" onclick="closeModal('profile-modal')">✕</button><div class="avatar" id="p-avatar" style="width:75px;height:75px;font-size:28px;margin:0 auto 10px">👤</div><h3 id="p-name">Имя</h3><div id="p-username" style="color:#64b5f6;font-size:13px">@user</div><div class="stats-row"><div class="stat-box"><b id="p-stars" style="color:#ffd54f">⭐ 0</b><div style="font-size:11px;color:#7f91a4">Звезды</div></div><div class="stat-box"><b id="p-gifts-count">🎁 0</b><div style="font-size:11px;color:#7f91a4">Подарки</div></div></div><div class="gifts-grid" id="p-gifts"></div></div></div>
<div class="modal" id="admin-modal"><div class="modal-card"><button class="close-modal" onclick="closeModal('admin-modal')">✕</button><h3 style="margin-bottom:12px;color:#e5a93c">👑 Панель Владельца</h3><div class="admin-group"><label>Пользователь:</label><select id="admin-user-select"></select></div><div class="admin-group"><label>Звезды:</label><div class="row-flex"><input type="number" id="admin-stars-input" value="100"/><button class="btn" style="width:auto;padding:0 14px" onclick="adminGiveStars()">⭐ Выдать</button></div></div><div class="admin-group"><label>Подарок:</label><div class="row-flex"><select id="admin-gift-select"><option value="👑 Корона">👑 Корона</option><option value="💎 Алмаз">💎 Алмаз</option><option value="🚀 Ракета">🚀 Ракета</option><option value="🧸 Мишка">🧸 Мишка</option><option value="❤️ Сердце">❤️ Сердце</option></select><button class="btn" style="width:auto;padding:0 14px" onclick="adminGiveGift()">🎁 Дарить</button></div></div><div class="admin-group"><label>Платный @юз:</label><div class="row-flex"><input type="text" id="admin-new-username" placeholder="Новый юз"/><button class="btn" style="width:auto;padding:0 14px" onclick="adminSetUsername()">@ Сменить</button></div></div><div class="row-flex" style="margin-top:10px"><button class="btn" style="background:#2b5278" onclick="adminVerify()">☑️ Галочка</button><button class="btn" style="background:#2b5278" onclick="adminCreateChannel()">➕ Канал</button></div></div></div>
<script src="/app.js"></script>
</body>
</html>
